<!DOCTYPE html>
<html lang="ko">
<head>

<title>현장 안전 안내 APP</title>
 
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}
 
body{
background:#f4f1ed;
padding:20px;
}
 
.container{
max-width:500px;
margin:auto;
}
 
.site-name{
color:#b45f5f;
font-size:14px;
margin-bottom:15px;
}
 
.banner{
position:relative;
overflow:hidden;
border-radius:20px;
}
 
.banner img{
width:100%;
height:220px;
object-fit:cover;
}
 
.banner-text{
position:absolute;
left:20px;
bottom:20px;
color:white;
}
 
.banner-text h2{
font-size:24px;
}
 
.title{
margin:30px 0 10px;
}
 
.title h1{
font-size:40px;
line-height:1.2;
}
 
.title p{
margin-top:10px;
color:#666;
}
 
.menu{
margin-top:25px;
display:flex;
flex-direction:column;
gap:15px;
}
 
.card{
text-decoration:none;
color:white;
padding:22px;
border-radius:18px;
transition:0.2s;
display:flex;
justify-content:space-between;
align-items:center;
}
 
.card:hover{
transform:translateY(-3px);
}
 
.card h3{
font-size:24px;
}
 
.card p{
font-size:14px;
margin-top:6px;
opacity:0.9;
}
 
.green{background:#0d6b35;}
.purple{background:#5d3db8;}
.teal{background:#007d7d;}
.blue{background:#1e4f86;}
.red{background:#be0f26;}
.navy{background:#1d2d5e;}
.magenta{background:#7d2859;}
 
.arrow{
font-size:30px;
}
</style>
</head>
