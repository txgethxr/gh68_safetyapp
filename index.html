<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
 <title>현장 안전관리 시스템 | SafetyBoard</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🦺 현장 안전관리</h1>
    <span id="todayLabel"></span>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="dashboard">대시보드</button>
    <button class="tab" data-view="risk">위험성평가</button>
    <button class="tab" data-view="near">아차사고</button>
    <button class="tab" data-view="tbm">TBM 일지</button>
  </nav>

  <main id="app"></main>

  <footer class="footer">
    <button id="exportBtn" class="ghost">CSV 내보내기</button>
    <button id="backupBtn" class="ghost">JSON 백업</button>
    <input type="file" id="restoreInput" accept=".json" hidden />
   <button id="restoreBtn" class="ghost">복원</button>
  </footer>

  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/risk.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
